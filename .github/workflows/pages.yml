name: Deploy static site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-visual.txt
      - name: Install visual builder
        run: python -m pip install -r scripts/requirements-visual.txt
      - name: Ensure all pages and articles have local images
        run: python scripts/build_visuals.py
      - name: Test future article coverage and missing-image gate
        run: python -m unittest discover -s scripts -p 'test_visuals.py'
      - name: Verify image coverage and complete article index
        run: python scripts/build_visuals.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
